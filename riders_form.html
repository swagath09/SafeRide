<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rider Details | SafeRide</title>
  <link rel="stylesheet" href="riders_form.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">

    <h2>Rider Information</h2>
    <p class="tagline">Help us keep you safe during every ride</p>

    <form id="riderForm">

      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Gender</label>
      <div class="gender">
        <label><input type="radio" name="gender" required> Male</label>
        <label><input type="radio" name="gender"> Female</label>
      </div>

      <label>Phone Number</label>
      <input type="tel" placeholder="Enter phone number" required>

      <label>Emergency Contact</label>
      <input type="tel" placeholder="Emergency contact number" required>

      <label>Date of Birth</label>
      <input type="date" required>

      <div class="checkbox">
        <input type="checkbox" id="agree">
        <label for="agree">
          I confirm that I am above 18 years and agree to the terms
        </label>
      </div>



      <button type="submit">Continue</button>

    </form>

  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const riderForm = document.getElementById("riderForm");
  if (!riderForm) return;

  // get currently logged-in user
  const currentUser = localStorage.getItem("currentUser");

  // ❌ no logged-in user → go back to login
  if (!currentUser) {
    window.location.href = "login_riders.html";
    return;
  }

  // ✅ check onboarding status FOR THIS USER
  const isCompleted = localStorage.getItem(
    `riderProfileCompleted_${currentUser}`
  );

  // already completed → skip form
  if (isCompleted === "true") {
    window.location.href = "homepage.html";
    return;
  }

  // handle form submit
  riderForm.addEventListener("submit", function (e) {
    e.preventDefault();

    // mark onboarding complete FOR THIS USER
    localStorage.setItem(
      `riderProfileCompleted_${currentUser}`,
      "true"
    );

    // redirect to homepage
    window.location.href = "homepage.html";
  });
});
</script>


</body>
</html>
