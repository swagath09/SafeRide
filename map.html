<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeRide | Trip Details</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    #map { width: 100%; height: 600px; margin-top: 10px; }
    .details, .journey { padding: 20px; margin: 30px auto; max-width: 700px; background: #f5f5f5; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    .details h2, .vehicle h3 { text-align: center; color: #333; }
    .details p, .vehicle p { color: #555; }
    .journey { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
    .vehicle { background: #fff; padding: 20px; border-radius: 15px; width: 250px; box-shadow: 0 0 15px rgba(0,0,0,0.1); text-align: center; }
    .vehicle img { width: 100%; height: 150px; object-fit: contain; }
    .price { color: #4CAF50; font-weight: bold; font-size: 18px; }
    button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    .status-message { display: none; text-align: center; margin-top: 20px; padding: 10px; border-radius: 10px; }
    .pending { background: #fff3cd; color: #856404; }
    .success { background: #d4edda; color: #155724; cursor: pointer; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>

<body>

<div id="map"></div>

<div class="details">
  <h2>Trip Details</h2>
  <p><strong>From:</strong> <span id="fromLocation"></span></p>
  <p><strong>To:</strong> <span id="toLocation"></span></p>
  <p><strong>Distance:</strong> <span id="distance"></span></p>
  <p><strong>Estimated Time:</strong> <span id="estimatedTime"></span></p>
  <div id="statusMessage" class="status-message"></div>
</div>

<div class="journey">
  <div class="vehicle">
    <img src="https://www.uber-assets.com/image/upload/...png" alt="Bike">
    <h3>Bike</h3>
    <p>Quick & affordable bike ride</p>
    <div class="price">₹120</div>
    <button onclick="requestRide('bike', 120)" id="bikeBtn">Request Bike</button>
  </div>
  <div class="vehicle">
    <img src="https://evtechnews.in/...png" alt="Auto">
    <h3>Auto</h3>
    <p>Comfortable auto ride</p>
    <div class="price">₹100</div>
    <button onclick="requestRide('auto', 100)" id="autoBtn">Request Auto</button>
  </div>
  <div class="vehicle">
    <img src="https://i.pinimg.com/originals/...png" alt="Car">
    <h3>Car</h3>
    <p>Premium car experience</p>
    <div class="price">₹150</div>
    <button onclick="requestRide('car', 150)" id="carBtn">Request Car</button>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBqW0NCGj6_fGfDBCuYR6-S_ZMsVqt6y0I",
    authDomain: "saferide-14dae.firebaseapp.com",
    databaseURL: "https://saferide-14dae-default-rtdb.firebaseio.com",
    projectId: "saferide-14dae",
    storageBucket: "saferide-14dae.appspot.com",
    messagingSenderId: "244029270602",
    appId: "1:244029270602:web:3f8edf95d4bb01ff5314b3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let currentUser = null;
  let currentRideId = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
    }
  });

  window.requestRide = function(vehicleType, fare) {
    if (!currentUser) return alert("Please login first");

    disableButtons();

    const rideDetails = JSON.parse(localStorage.getItem('rideDetails'));
    if (!rideDetails) return alert("Ride details not found!");

    const rideData = {
      userId: currentUser.uid,
      pickup: rideDetails.pickup,
      destination: rideDetails.destination,
      distance: document.getElementById('distance').textContent,
      estimatedTime: document.getElementById('estimatedTime').textContent,
      vehicleType,
      fare,
      status: 'pending',
      timestamp: new Date().toISOString()
    };

    const ridesRef = ref(db, 'rides');
    const newRide = push(ridesRef);
    currentRideId = newRide.key;

    set(newRide, rideData).then(() => {
      showStatus('pending', 'Looking for a driver...');
      listenToRideStatus(currentRideId);
    }).catch(() => {
      showStatus('error', 'Error requesting ride');
      enableButtons();
    });
  };

  function listenToRideStatus(rideId) {
    const rideRef = ref(db, `rides/${rideId}`);
    onValue(rideRef, (snapshot) => {
      const ride = snapshot.val();
      if (!ride) return;

      if (ride.status === 'accepted') {
        showStatus('success', 'Ride accepted! Click here for details');
        document.getElementById('statusMessage').onclick = () => {
          window.location.href = `ride_details.html?rideId=${rideId}`;
        };
      } else if (ride.status === 'rejected') {
        showStatus('error', 'No driver available. Try another ride.');
        enableButtons();
      }
    });
  }

  function showStatus(type, message) {
    const status = document.getElementById('statusMessage');
    status.textContent = message;
    status.className = `status-message ${type}`;
    status.style.display = 'block';
  }

  function disableButtons() {
    document.getElementById('bikeBtn').disabled = true;
    document.getElementById('autoBtn').disabled = true;
    document.getElementById('carBtn').disabled = true;
  }

  function enableButtons() {
    document.getElementById('bikeBtn').disabled = false;
    document.getElementById('autoBtn').disabled = false;
    document.getElementById('carBtn').disabled = false;
  }
</script>

<!-- Google Maps Init -->
<script>
  function initMap() {
    const rideDetails = JSON.parse(localStorage.getItem('rideDetails'));
    if (!rideDetails) {
      alert('Please book your ride first');
      window.location.href = 'book_ride.html';
      return;
    }

    const from = rideDetails.pickup + ", Hyderabad";
    const to = rideDetails.destination + ", Hyderabad";

    document.getElementById('fromLocation').textContent = rideDetails.pickup;
    document.getElementById('toLocation').textContent = rideDetails.destination;

    const map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: { lat: 17.385044, lng: 78.486671 }
    });

    const directionsService = new google.maps.DirectionsService();
    const directionsRenderer = new google.maps.DirectionsRenderer();
    directionsRenderer.setMap(map);

    directionsService.route(
      {
        origin: from,
        destination: to,
        travelMode: 'DRIVING'
      },
      (result, status) => {
        if (status === "OK") {
          directionsRenderer.setDirections(result);
          const route = result.routes[0].legs[0];
          document.getElementById('distance').textContent = route.distance.text;
          document.getElementById('estimatedTime').textContent = route.duration.text;
        } else {
          alert("Could not display directions: " + status);
        }
      }
    );
  }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBtWnC2ImzO5Q8Xlqn75zRURlwrfCbpj0A&callback=initMap" async defer></script>

</body>
</html>
